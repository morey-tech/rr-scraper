name: Update Transcripts

on:
  workflow_dispatch: # Allows manual triggering of the workflow
  schedule:
    # Run every Friday at 08:00 UTC
    - cron: '0 8 * * 5'

jobs:
  update-transcripts:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Grants write access to the repository contents

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.x'

      - name: Test transcript storage and migration
        run: python3 -m unittest discover -p 'test_*.py' -v

      # Install dependencies
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      # Run the main.py script
      - name: Run transcript scraper
        run: |
          python3 main.py

      # Commit and push changes if any
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add transcripts/
          if ! git diff --cached --quiet -- transcripts/; then
            if [ -s /tmp/downloaded_episodes.txt ]; then
              downloaded_episodes=$(cat /tmp/downloaded_episodes.txt)
              commit_message="chore: Update transcripts with episode(s) $downloaded_episodes"
            else
              commit_message="chore: Update transcripts"
            fi
            git commit -m "$commit_message"
            git push
          else
            echo "No changes to commit."
          fi
